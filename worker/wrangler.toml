name = "gofarva-newsletter"
main = "src/index.js"
compatibility_date = "2024-10-01"
account_id = "c26e84892ea99e13696c6ce64c4583b8"

# Workers Custom Domain (creates DNS + cert). Do not touch the apex / GitHub Pages.
routes = [
  { pattern = "api.gofarva.run", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "gofarva-newsletter"
# Replace after: wrangler d1 create gofarva-newsletter
database_id = "ebe715d4-a436-4d0a-8f4c-5567d4a57ee3"

[vars]
ALLOWED_ORIGINS = "https://gofarva.run,https://www.gofarva.run"
CONSENT_TEXT_VERSION_DEFAULT = "launch-notify-v1"
